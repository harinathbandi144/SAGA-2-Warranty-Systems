spring:
  application:
    name: claim-service
  cloud:
    openfeign:
      client:
        config:
          dealer-service:
            loggerLevel: FULL
  datasource:
    url: jdbc:postgresql://localhost:5433/claimdb
    username: harinathbandi
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: claim_schema
        format_sql: true

  flyway:
    enabled: true
    schemas: claim_schema
    default-schema: claim_schema
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
services:
  vehicle:
    url: http://localhost:8081
  dealer:
    url: http://localhost:8083
  redis:
    image: redis:7.4-alpine
    container_name: saga2-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

resilience4j:
  retry:
    instances:
      vehicleService:
        maxAttempts: 3
        waitDuration: 1s

  circuitbreaker:
    instances:
      vehicleService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      dealerService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException


logging:
  level:
    com.saga.claim_service.client.service.DealerClient: DEBUG
